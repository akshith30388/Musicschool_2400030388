spring.application.name=MusicSchool
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musicschool}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgresql}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

